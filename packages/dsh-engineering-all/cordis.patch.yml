# dsh-engineering-all bundle patch: engineering family plugin rows.
# 注意：beyond-workscope 是外部成员（由 dsh-web-ui-all 注册），此处不 insert 其行，
# 避免与 dsh-web-ui 全家桶重复注册冲突（duplicate loader entry id）。
- insert:
    - id: engineering-all
      name: '@linxin666/dsh-engineering-all'

# beyond-workscope 工程副本（自动切换：dsh-web-ui 版在场时本行 apply 内 no-op）
- insert:
    - id: beyond-workscope-eng
      name: '@linxin666/dsh-beyond-workscope-eng'

# dsh-nas 系统包（桌面/窗口/文件管理/回收站/应用注册表）
- insert:
    - id: nas
      name: '@linxin666/dsh-nas'
